name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DESEARCH_LIVE_ENABLED: "false"
      LLM_LIVE_ENABLED: "false"
      DESEARCH_API_KEY: ""
      CHUTES_API_KEY: ""
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
